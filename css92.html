<!DOCTYPE html>
<html>
<head>
    <title>KPI Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
            padding: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .kpi {
            background: white;
            padding: 25px;
            border-radius: 12px;
            border-left: 5px solid #6366f1;
        }

        .value {
            font-size: 32px;
            font-weight: bold;
        }

        .positive {
            color: #16a34a;
        }

        .negative {
            color: #dc2626;
        }
    </style>
</head>

<body>

<h1>KPI Analytics Dashboard</h1>

<div class="grid">

    <div class="kpi">
        <h3>Monthly Revenue</h3>
        <div class="value">$125K</div>
        <p class="positive">+18%</p>
    </div>

    <div class="kpi">
        <h3>New Customers</h3>
        <div class="value">2,450</div>
        <p class="positive">+12%</p>
    </div>

    <div class="kpi">
        <h3>Churn Rate</h3>
        <div class="value">2.4%</div>
        <p class="negative">+0.3%</p>
    </div>

    <div class="kpi">
        <h3>Retention</h3>
        <div class="value">94%</div>
        <p class="positive">+4%</p>
    </div>

</div>

</body>
</html>
