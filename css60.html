<!DOCTYPE html>
<html>
<head>
<title>Icon Buttons</title>
<style>
button{border:0;padding:12px 18px;border-radius:7px;margin:10px;
cursor:pointer}
.icon{font-size:22px;background:#e2e8f0}
.action{background:#4f46e5;color:white}
</style>
</head>
<body>

<button class="icon">✏️</button>
<button class="icon">🗑️</button>
<button class="icon">⚙️</button>

<button class="action">＋ Add Project</button>
<button class="action">⬇ Download</button>

</body>
</html>
