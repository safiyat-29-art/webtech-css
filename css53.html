<!DOCTYPE html>
<html>
<head>
<title>Dashboard Card</title>
<style>
.card{width:400px;padding:25px;background:white;border-radius:12px;
box-shadow:0 4px 15px #ddd;font-family:Arial}
.bar{height:10px;background:#e2e8f0;border-radius:10px;margin:10px 0}
.fill{width:75%;height:100%;background:#4f46e5;border-radius:10px}
</style>
</head>
<body>

<div class="card">
<h2>Project Progress</h2>
<p>Website Redesign</p>
<div class="bar"><div class="fill"></div></div>
<p>75% completed</p>
</div>

</body>
</html>
