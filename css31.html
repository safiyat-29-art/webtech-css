<!DOCTYPE html>
<html>
<head>
    <title>CSS Transitions</title>

    <style>
        .box {
            width: 200px;
            height: 100px;
            background: blue;
            color: white;
            padding: 30px;
            margin: 50px;

            transition:
                background-color 0.5s,
                width 0.5s,
                box-shadow 0.5s,
                transform 0.5s;
        }

        .box:hover {
            background-color: red;
            width: 300px;
            transform: translateX(30px);
            box-shadow: 10px 10px 20px gray;
        }
    </style>
</head>
<body>

    <div class="box">
        Hover Me
    </div>

</body>
</html>
