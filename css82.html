<!DOCTYPE html>
<html>
<head>
<title>Timeline</title>
<style>
.timeline{width:500px;margin:40px;font-family:Arial;
border-left:3px solid #4f46e5;padding-left:30px}
.event{position:relative;margin-bottom:35px}
.event:before{content:"";position:absolute;left:-40px;top:5px;
width:15px;height:15px;background:#4f46e5;border-radius:50%}
</style>
</head>
<body>

<div class="timeline">

<div class="event">
<h3>Project Created</h3>
<p>John created the project.</p>
<small>10:00 AM</small>
</div>

<div class="event">
<h3>Design Uploaded</h3>
<p>Sarah uploaded design files.</p>
<small>11:30 AM</small>
</div>

<div class="event">
<h3>Project Completed</h3>
<p>The project was completed.</p>
<small>4:00 PM</small>
</div>

</div>

</body>
</html>
