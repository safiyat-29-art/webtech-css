<!DOCTYPE html>
<html>
<head>
    <title>CSS Filters</title>

    <style>
        img {
            width: 200px;
            margin: 10px;
        }

        .blur {
            filter: blur(4px);
        }

        .grayscale {
            filter: grayscale(100%);
        }

        .brightness {
            filter: brightness(150%);
        }

        .contrast {
            filter: contrast(200%);
        }

        .opacity {
            filter: opacity(40%);
        }
    </style>
</head>
<body>

    <h1>CSS Filters</h1>

    <img src="image.jpg" class="blur" alt="Blur">
    <img src="image.jpg" class="grayscale" alt="Grayscale">
    <img src="image.jpg" class="brightness" alt="Brightness">
    <img src="image.jpg" class="contrast" alt="Contrast">
    <img src="image.jpg" class="opacity" alt="Opacity">

</body>
</html>
