<!DOCTYPE html>
<html>
<head>
<title>Pricing Card</title>
<style>
.pricing{width:300px;padding:30px;border:2px solid #4f46e5;
border-radius:15px;font-family:Arial;text-align:center}
.price{font-size:40px;font-weight:bold;color:#4f46e5}
li{list-style:none;padding:8px}
button{padding:12px 30px;background:#4f46e5;color:white;border:0;border-radius:7px}
</style>
</head>
<body>

<div class="pricing">
<h2>Pro</h2>
<div class="price">$29</div>
<p>per month</p>
<ul>
<li>✓ Unlimited Projects</li>
<li>✓ Advanced Analytics</li>
<li>✓ Priority Support</li>
</ul>
<button>Choose Plan</button>
</div>

</body>
</html>
