<!DOCTYPE html>
<html>
<head>
<title>Badges and Chips</title>
<style>
.badge{background:#dcfce7;color:#166534;padding:5px 10px;border-radius:15px}
.label{background:#e0e7ff;color:#3730a3;padding:6px 12px}
.tag{background:#fef3c7;color:#92400e;padding:6px 12px;border-radius:5px}
.chip{display:inline-flex;gap:8px;background:#e2e8f0;
padding:8px 15px;border-radius:20px}
</style>
</head>
<body>

<p>Status: <span class="badge">Active</span></p>
<p><span class="label">PRO</span></p>
<p><span class="tag">JavaScript</span></p>
<p><span class="chip">Design ×</span></p>

</body>
</html>
