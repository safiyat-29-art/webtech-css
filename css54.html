<!DOCTYPE html>
<html>
<head>
<title>Notification Card</title>
<style>
.notification{display:flex;gap:15px;width:400px;padding:18px;
border:1px solid #ddd;border-radius:10px;font-family:Arial}
.icon{font-size:25px}
</style>
</head>
<body>

<div class="notification">
<div class="icon">🔔</div>
<div>
<strong>New project assigned</strong>
<p>Sarah assigned you a new project.</p>
<small>5 minutes ago</small>
</div>
</div>

</body>
</html>
