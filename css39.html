<!DOCTYPE html>
<html>
<head>
<title>Mobile Drawer</title>
<style>
body{margin:0;font-family:Arial}
button{margin:20px;padding:10px 15px}
.drawer{position:fixed;left:-280px;top:0;width:250px;height:100%;
background:#111827;color:white;padding:25px;transition:.3s}
.drawer.open{left:0}
.drawer a{display:block;color:white;padding:15px;text-decoration:none}
</style>
</head>
<body>

<button onclick="toggle()">☰ Menu</button>

<div class="drawer" id="drawer">
<h2>CloudFlow</h2>
<a>Dashboard</a>
<a>Projects</a>
<a>Analytics</a>
<a>Settings</a>
</div>

<script>
function toggle(){
document.getElementById("drawer").classList.toggle("open");
}
</script>

</body>
</html>
