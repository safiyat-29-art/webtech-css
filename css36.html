<!DOCTYPE html>
<html>
<head>
<title>SaaS Navbar</title>
<style>
body{margin:0;font-family:Arial;background:#f8fafc}
nav{height:64px;background:white;border-bottom:1px solid #ddd;
display:flex;align-items:center;padding:0 30px;gap:30px}
.logo{font-size:22px;font-weight:bold;color:#4f46e5}
.links{display:flex;gap:25px;flex:1}
a{text-decoration:none;color:#475569}
.btn{background:#4f46e5;color:white;padding:10px 18px;border-radius:7px}
</style>
</head>
<body>

<nav>
    <div class="logo">CloudFlow</div>
    <div class="links">
        <a href="#">Product</a>
        <a href="#">Solutions</a>
        <a href="#">Pricing</a>
        <a href="#">Resources</a>
    </div>
    <a href="#">Log in</a>
    <a class="btn" href="#">Get Started</a>
</nav>

</body>
</html>
