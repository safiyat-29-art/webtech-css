<!DOCTYPE html>
<html>
<head>
    <title>CSS Units</title>

    <style>
        html {
            font-size: 16px;
        }

        .percentage {
            width: 50%;
            height: 100px;
            background: lightblue;
        }

        .viewport {
            width: 50vw;
            height: 20vh;
            background: lightgreen;
        }

        .rem-box {
            width: 20rem;
            height: 8rem;
            background: orange;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <h1>CSS Units</h1>

    <div class="percentage">
        50% Width
    </div>

    <br>

    <div class="viewport">
        50vw Width and 20vh Height
    </div>

    <br>

    <div class="rem-box">
        Width and height using rem
    </div>

</body>
</html>
