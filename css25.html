<!DOCTYPE html>
<html>
<head>
    <title>CSS Outline</title>

    <style>
        .box {
            width: 300px;
            padding: 30px;
            margin: 50px;
            border: 3px solid blue;

            outline: 4px dashed red;
            outline-offset: 10px;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>Outline Example</h2>
        <p>
            The outline is outside the border.
        </p>
    </div>

</body>
</html>
