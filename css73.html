<!DOCTYPE html>
<html>
<head>
<title>Command Palette</title>
<style>
body{font-family:Arial}
.palette{width:450px;margin:50px auto;border:1px solid #ddd;
border-radius:10px;box-shadow:0 10px 30px #ddd}
input{width:100%;box-sizing:border-box;padding:18px;border:0;
border-bottom:1px solid #ddd;font-size:16px}
.item{padding:15px}
.item:hover{background:#f1f5f9}
</style>
</head>
<body>

<div class="palette">
<input placeholder="Search commands...">
<div class="item">⌘ Create Project</div>
<div class="item">⌘ Search Files</div>
<div class="item">⌘ Open Settings</div>
<div class="item">⌘ Logout</div>
</div>

</body>
</html>
