<!DOCTYPE html>
<html>
<head>
<title>Tooltip</title>
<style>
.tooltip{position:relative;display:inline-block;margin:50px}
.tip{visibility:hidden;position:absolute;bottom:130%;left:50%;
transform:translateX(-50%);background:#111827;color:white;
padding:8px 12px;border-radius:5px;white-space:nowrap}
.tooltip:hover .tip{visibility:visible}
</style>
</head>
<body>

<div class="tooltip">
    Hover over me
    <span class="tip">This is a tooltip</span>
</div>

</body>
</html>
