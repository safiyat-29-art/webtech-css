<!DOCTYPE html>
<html>
<head>
    <title>Revenue Analytics</title>

    <style>
        body {
            font-family: Arial;
            background: #f8fafc;
            padding: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px #ddd;
        }

        .revenue {
            font-size: 40px;
            color: #16a34a;
        }

        .bars {
            height: 250px;
            display: flex;
            align-items: end;
            gap: 20px;
            border-bottom: 2px solid #333;
        }

        .bar {
            flex: 1;
            background: #22c55e;
            min-width: 30px;
        }
    </style>
</head>

<body>

<h1>Revenue Analytics</h1>

<div class="card">
    <h3>Total Revenue</h3>
    <div class="revenue">$425,800</div>
    <p>Current financial year</p>
</div>

<div class="card">
    <h2>Monthly Revenue</h2>

    <div class="bars">
        <div class="bar" style="height:40%"></div>
        <div class="bar" style="height:55%"></div>
        <div class="bar" style="height:45%"></div>
        <div class="bar" style="height:70%"></div>
        <div class="bar" style="height:65%"></div>
        <div class="bar" style="height:85%"></div>
        <div class="bar" style="height:95%"></div>
    </div>
</div>

</body>
</html>
