<!DOCTYPE html>
<html>
<head>
    <title>Visibility and Opacity</title>

    <style>
        .visible {
            background: lightgreen;
            padding: 20px;
        }

        .hidden {
            visibility: hidden;
            background: red;
            padding: 20px;
        }

        .transparent {
            opacity: 0.3;
            background: blue;
            color: white;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="visible">Visible Element</div>

    <div class="hidden">Hidden Element</div>

    <div class="transparent">
        30% Opacity
    </div>

</body>
</html>
