<!DOCTYPE html>
<html>
<head>
<title>Statistics Card</title>
<style>
.card{width:220px;padding:20px;background:white;border-radius:12px;
box-shadow:0 3px 15px #ddd;font-family:Arial}
.number{font-size:35px;font-weight:bold}
.up{color:green}
</style>
</head>
<body>

<div class="card">
<p>Total Users</p>
<div class="number">24,580</div>
<p class="up">▲ 12.5%</p>
</div>

</body>
</html>
