<!DOCTYPE html>
<html>
<head>
<title>Drawer</title>
<style>
.drawer{position:fixed;right:-350px;top:0;width:300px;height:100%;
background:white;box-shadow:-5px 0 20px #aaa;padding:25px;
transition:.3s}
.drawer.open{right:0}
button{padding:10px 18px}
</style>
</head>
<body>

<button onclick="openDrawer()">Open Panel</button>

<div class="drawer" id="drawer">
<button onclick="closeDrawer()">Close ×</button>
<h2>Settings</h2>
<p>Panel content goes here.</p>
</div>

<script>
function openDrawer(){drawer.classList.add("open")}
function closeDrawer(){drawer.classList.remove("open")}
</script>

</body>
</html>
