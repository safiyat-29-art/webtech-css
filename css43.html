<!DOCTYPE html>
<html>
<head>
<title>Tabs</title>
<style>
.tabs{display:flex;border-bottom:1px solid #ddd}
.tab{padding:15px 25px;cursor:pointer}
.active{color:#4f46e5;border-bottom:3px solid #4f46e5}
.content{padding:25px}
</style>
</head>
<body>

<div class="tabs">
<div class="tab active" onclick="show(0)">Overview</div>
<div class="tab" onclick="show(1)">Analytics</div>
<div class="tab" onclick="show(2)">Settings</div>
</div>

<div class="content" id="content">Overview content</div>

<script>
let text=["Overview content","Analytics content","Settings content"];
function show(i){
document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
document.querySelectorAll(".tab")[i].classList.add("active");
document.getElementById("content").textContent=text[i];
}
</script>

</body>
</html>
