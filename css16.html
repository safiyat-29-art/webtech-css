<!DOCTYPE html>
<html>
<head>
    <title>Border Radius</title>

    <style>
        .card {
            width: 250px;
            padding: 30px;
            background: lightblue;
            border-radius: 20px;
            margin: 20px;
        }

        .circle {
            width: 150px;
            height: 150px;
            background: tomato;
            border-radius: 50%;
            margin: 20px;
        }

        .pill {
            display: inline-block;
            background: green;
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
        }

        .custom {
            width: 200px;
            height: 150px;
            background: purple;
            border-radius: 10px 50px 10px 50px;
            margin: 20px;
        }
    </style>
</head>
<body>

    <div class="card">Rounded Card</div>

    <div class="circle"></div>

    <div class="pill">Pill Button</div>

    <div class="custom"></div>

</body>
</html>
