<!DOCTYPE html>
<html>
<head>
    <title>CSS Text Properties</title>

    <style>
        h1 {
            text-align: center;
            text-decoration: underline;
            text-transform: uppercase;
        }

        p {
            text-align: justify;
            text-indent: 40px;
            letter-spacing: 2px;
            word-spacing: 5px;
            line-height: 1.8;
        }

        .overline {
            text-decoration: overline;
        }

        .capitalize {
            text-transform: capitalize;
        }
    </style>
</head>
<body>

    <h1>Text Formatting</h1>

    <p>
        CSS provides many properties for controlling the
        appearance and spacing of text on a webpage.
    </p>

    <p class="overline">Overline text</p>
    <p class="capitalize">this text is transformed.</p>

</body>
</html>
