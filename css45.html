<!DOCTYPE html>
<html>
<head>
<title>Pagination</title>
<style>
.pagination{display:flex;gap:8px;justify-content:center;margin:50px}
.pagination a{padding:10px 15px;border:1px solid #ddd;
text-decoration:none;color:#333;border-radius:5px}
.active{background:#4f46e5!important;color:white!important}
</style>
</head>
<body>

<div class="pagination">
<a>‹</a><a>1</a><a class="active">2</a>
<a>3</a><a>4</a><a>5</a><a>›</a>
</div>

</body>
</html>
