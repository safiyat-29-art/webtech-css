<!DOCTYPE html>
<html>
<head>
<title>Confirmation Dialog</title>
<style>
.dialog{width:350px;padding:25px;border:1px solid #ddd;
border-radius:10px;font-family:Arial}
.delete{background:#dc2626;color:white;border:0;padding:10px 20px}
.cancel{padding:10px 20px}
</style>
</head>
<body>

<div class="dialog">
<h2>Delete Project?</h2>
<p>This action cannot be undone.</p>
<button class="cancel">Cancel</button>
<button class="delete">Delete</button>
</div>

</body>
</html>
