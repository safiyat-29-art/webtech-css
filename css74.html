<!DOCTYPE html>
<html>
<head>
<title>Accordion</title>
<style>
.item{border-bottom:1px solid #ddd}
.question{padding:18px;cursor:pointer;font-weight:bold}
.answer{display:none;padding:18px;background:#f8fafc}
.answer.show{display:block}
</style>
</head>
<body>

<div class="item">
<div class="question" onclick="toggle(this)">What is SaaS?</div>
<div class="answer">SaaS means Software as a Service.</div>
</div>

<div class="item">
<div class="question" onclick="toggle(this)">What is CloudFlow?</div>
<div class="answer">CloudFlow is a sample SaaS platform.</div>
</div>

<script>
function toggle(el){
el.nextElementSibling.classList.toggle("show");
}
</script>

</body>
</html>
