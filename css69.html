<!DOCTYPE html>
<html>
<head>
<title>Popover</title>
<style>
.popover{position:relative;display:inline-block}
.content{display:none;position:absolute;top:45px;left:0;
background:white;padding:20px;width:220px;
box-shadow:0 5px 20px #aaa;border-radius:8px}
.popover:hover .content{display:block}
button{padding:10px}
</style>
</head>
<body>

<div class="popover">
<button>Account</button>
<div class="content">
<strong>John Doe</strong>
<p>john@example.com</p>
<a>View Profile</a>
</div>
</div>

</body>
</html>
