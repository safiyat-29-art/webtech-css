<!DOCTYPE html>
<html>
<head>
<title>Activity Feed</title>
<style>
.feed{width:450px;font-family:Arial}
.item{display:flex;gap:15px;padding:18px 0;border-bottom:1px solid #ddd}
.dot{width:12px;height:12px;background:#4f46e5;border-radius:50%;margin-top:5px}
</style>
</head>
<body>

<div class="feed">
<h2>Recent Activity</h2>

<div class="item"><div class="dot"></div><div>John created a project<br><small>10 min ago</small></div></div>
<div class="item"><div class="dot"></div><div>Sarah uploaded a file<br><small>30 min ago</small></div></div>
<div class="item"><div class="dot"></div><div>Mike completed a task<br><small>1 hour ago</small></div></div>

</div>

</body>
</html>
