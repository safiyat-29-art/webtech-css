<!DOCTYPE html>
<html>
<head>
<title>Dropdown Menu</title>
<style>
nav{display:flex;gap:25px;padding:20px;background:#111827}
nav a{color:white;text-decoration:none}
.dropdown{position:relative}
.dropdown-menu{display:none;position:absolute;background:white;
padding:10px;width:150px;box-shadow:0 5px 15px #aaa}
.dropdown-menu a{display:block;color:#333;padding:10px}
.dropdown:hover .dropdown-menu{display:block}
</style>
</head>
<body>

<nav>
<a href="#">Home</a>
<div class="dropdown">
<a href="#">Products ▼</a>
<div class="dropdown-menu">
<a>Analytics</a>
<a>Automation</a>
<a>Security</a>
</div>
</div>
<a href="#">Pricing</a>
</nav>

</body>
</html>
