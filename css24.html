<!DOCTYPE html>
<html>
<head>
    <title>CSS Cursor</title>

    <style>
        .box {
            padding: 20px;
            margin: 10px;
            background: lightblue;
        }

        .default {
            cursor: default;
        }

        .pointer {
            cursor: pointer;
        }

        .text {
            cursor: text;
        }

        .wait {
            cursor: wait;
        }

        .not-allowed {
            cursor: not-allowed;
        }

        .pointer:hover {
            background: blue;
            color: white;
        }
    </style>
</head>
<body>

    <div class="box default">Default Cursor</div>
    <div class="box pointer">Pointer Cursor - Hover Me</div>
    <div class="box text">Text Cursor</div>
    <div class="box wait">Wait Cursor</div>
    <div class="box not-allowed">Not Allowed Cursor</div>

</body>
</html>
