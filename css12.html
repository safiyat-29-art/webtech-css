<!DOCTYPE html>
<html>
<head>
    <title>Box Sizing</title>

    <style>
        .content-box {
            box-sizing: content-box;
            width: 300px;
            padding: 30px;
            border: 5px solid red;
            background-color: lightpink;
        }

        .border-box {
            box-sizing: border-box;
            width: 300px;
            padding: 30px;
            border: 5px solid blue;
            background-color: lightblue;
        }

        div {
            margin: 20px;
        }
    </style>
</head>
<body>

    <div class="content-box">
        <h2>Content Box</h2>
    </div>

    <div class="border-box">
        <h2>Border Box</h2>
    </div>

</body>
</html>
