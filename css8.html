<!DOCTYPE html>
<html>
<head>
    <title>CSS Fonts</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .large {
            font-size: 30px;
        }

        .bold {
            font-weight: bold;
        }

        .italic {
            font-style: italic;
        }

        .small-caps {
            font-variant: small-caps;
        }
    </style>
</head>
<body>

    <h1>CSS Font Properties</h1>

    <p class="large">Large font-size</p>
    <p class="bold">Bold font-weight</p>
    <p class="italic">Italic font-style</p>
    <p class="small-caps">Small caps font variant</p>

</body>
</html>
