<!DOCTYPE html>
<html>
<head>
<title>Responsive Navbar</title>
<style>
body{margin:0;font-family:Arial}
nav{display:flex;align-items:center;padding:18px 30px;background:#fff;
border-bottom:1px solid #ddd}
.logo{font-size:22px;font-weight:bold;color:#4f46e5}
.links{display:flex;gap:25px;margin-left:auto}
.menu{display:none;font-size:25px}
@media(max-width:700px){
.links{display:none}
.menu{display:block;margin-left:auto}
}
</style>
</head>
<body>

<nav>
<div class="logo">CloudFlow</div>
<div class="links">
<a>Product</a><a>Pricing</a><a>Docs</a><a>Contact</a>
</div>
<div class="menu">☰</div>
</nav>

</body>
</html>
