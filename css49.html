<!DOCTYPE html>
<html>
<head>
<title>Feature Card</title>
<style>
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{padding:25px;background:#fff;border:1px solid #ddd;border-radius:12px}
.icon{font-size:35px}
</style>
</head>
<body>

<h1>Platform Features</h1>

<div class="grid">
<div class="card"><div class="icon">⚡</div><h2>Fast</h2><p>Lightning-fast performance.</p></div>
<div class="card"><div class="icon">🔒</div><h2>Secure</h2><p>Enterprise-grade security.</p></div>
<div class="card"><div class="icon">📊</div><h2>Analytics</h2><p>Powerful business insights.</p></div>
</div>

</body>
</html>
