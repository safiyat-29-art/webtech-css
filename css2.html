<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors</title>

    <style>
        /* Universal selector */
        * {
            box-sizing: border-box;
        }

        /* Element selector */
        h1 {
            color: blue;
        }

        /* Class selector */
        .box {
            background-color: lightgreen;
            padding: 15px;
        }

        /* ID selector */
        #special {
            color: red;
        }

        /* Attribute selector */
        input[type="text"] {
            border: 2px solid orange;
            padding: 8px;
        }

        /* Grouping selector */
        h2, p {
            font-family: Arial;
        }
    </style>
</head>
<body>

    <h1>Element Selector</h1>

    <h2>Grouping Selector</h2>

    <p class="box">Class Selector</p>

    <p id="special">ID Selector</p>

    <input type="text" placeholder="Attribute Selector">

</body>
</html>
