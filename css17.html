<!DOCTYPE html>
<html>
<head>
    <title>Shadows</title>

    <style>
        h1 {
            text-shadow: 3px 3px 5px gray;
        }

        .card {
            width: 300px;
            padding: 30px;
            margin: 50px;
            background: white;
            box-shadow: 5px 5px 15px gray;
        }
    </style>
</head>
<body>

    <h1>Text Shadow Example</h1>

    <div class="card">
        <h2>Box Shadow</h2>
        <p>This card has a shadow.</p>
    </div>

</body>
</html>
