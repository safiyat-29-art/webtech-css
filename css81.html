<!DOCTYPE html>
<html>
<head>
<title>Progress Stepper</title>
<style>
.stepper{display:flex;justify-content:space-between;
width:600px;margin:50px auto}
.step{text-align:center}
.circle{width:40px;height:40px;border-radius:50%;
background:#e2e8f0;display:flex;align-items:center;
justify-content:center;margin:auto}
.active .circle{background:#4f46e5;color:white}
</style>
</head>
<body>

<div class="stepper">
<div class="step active"><div class="circle">1</div><p>Account</p></div>
<div class="step active"><div class="circle">2</div><p>Profile</p></div>
<div class="step"><div class="circle">3</div><p>Payment</p></div>
<div class="step"><div class="circle">4</div><p>Complete</p></div>
</div>

</body>
</html>
