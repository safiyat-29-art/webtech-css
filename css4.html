<!DOCTYPE html>
<html>
<head>
    <title>CSS Colors</title>

    <style>
        body {
            background-color: #f0f8ff;
        }

        h1 {
            color: navy;
        }

        .text {
            color: rgb(0, 128, 0);
        }

        .box {
            background-color: lightyellow;
            border: 3px solid #ff6600;
            padding: 20px;
        }

        button {
            background-color: purple;
            color: white;
            border: none;
            padding: 12px 25px;
        }
    </style>
</head>
<body>

    <h1>CSS Colors</h1>

    <p class="text">This text has a custom color.</p>

    <div class="box">
        Colored background and border.
    </div>

    <br>

    <button>Click Me</button>

</body>
</html>
