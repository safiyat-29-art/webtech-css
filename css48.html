<!DOCTYPE html>
<html>
<head>
<title>Product Card</title>
<style>
.card{width:280px;border:1px solid #ddd;border-radius:12px;overflow:hidden;
font-family:Arial}
.image{height:150px;background:#dbeafe;display:flex;
align-items:center;justify-content:center;font-size:50px}
.content{padding:20px}
.price{font-size:24px;font-weight:bold}
button{background:#4f46e5;color:white;border:0;padding:12px;width:100%}
</style>
</head>
<body>

<div class="card">
<div class="image">☁️</div>
<div class="content">
<h2>Cloud Pro</h2>
<p>Advanced cloud storage solution.</p>
<div class="price">$29/month</div>
<br>
<button>Buy Now</button>
</div>
</div>

</body>
</html>
