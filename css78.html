<!DOCTYPE html>
<html>
<head>
<title>Loading State</title>
<style>
.loading{text-align:center;padding:80px;font-family:Arial}
.spinner{width:50px;height:50px;border:6px solid #ddd;
border-top-color:#4f46e5;border-radius:50%;
animation:spin 1s linear infinite;margin:auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="loading">
<div class="spinner"></div>
<h2>Loading...</h2>
<p>Please wait while we fetch your data.</p>
</div>

</body>
</html>
