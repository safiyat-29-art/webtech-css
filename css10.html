<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>

    <style>
        .box {
            width: 300px;

            /* Content */
            background-color: lightblue;

            /* Padding */
            padding: 30px;

            /* Border */
            border: 5px solid blue;

            /* Margin */
            margin: 50px;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>CSS Box Model</h2>
        <p>Content + Padding + Border + Margin</p>
    </div>

</body>
</html>
