<!DOCTYPE html>
<html>
<head>
    <title>CSS Measurement Units</title>

    <style>
        html {
            font-size: 16px;
        }

        .parent {
            font-size: 20px;
        }

        .em {
            font-size: 2em;
            background: lightblue;
        }

        .rem {
            font-size: 2rem;
            background: lightgreen;
        }

        .vw {
            font-size: 5vw;
            background: yellow;
        }

        .vh {
            height: 20vh;
            background: orange;
        }

        .percent {
            width: 75%;
            background: pink;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="parent">

        <p class="em">2em Text</p>

        <p class="rem">2rem Text</p>

        <p class="vw">5vw Text</p>

        <div class="vh">20vh Height</div>

        <div class="percent">75% Width</div>

    </div>

</body>
</html>
