<!DOCTYPE html>
<html>
<head>
    <title>CSS Dimensions</title>

    <style>
        .box {
            width: 50%;
            height: 200px;

            min-width: 250px;
            max-width: 700px;

            min-height: 150px;
            max-height: 300px;

            background-color: lightblue;
            padding: 20px;
            margin: 20px auto;
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>CSS Dimensions</h1>
        <p>
            Width, height, minimum and maximum dimensions.
        </p>
    </div>

</body>
</html>
