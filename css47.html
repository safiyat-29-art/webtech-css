<!DOCTYPE html>
<html>
<head>
<title>Profile Card</title>
<style>
.card{text-align:center;width:280px;padding:25px;border-radius:15px;
box-shadow:0 5px 20px #ddd;font-family:Arial}
.avatar{width:90px;height:90px;border-radius:50%;background:#4f46e5;
color:white;display:flex;align-items:center;justify-content:center;
font-size:30px;margin:auto}
</style>
</head>
<body>

<div class="card">
<div class="avatar">JD</div>
<h2>John Doe</h2>
<p>Product Designer</p>
<p>Designing simple and useful SaaS products.</p>
<button>View Profile</button>
</div>

</body>
</html>
