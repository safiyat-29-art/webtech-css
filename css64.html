<!DOCTYPE html>
<html>
<head>
<title>Alerts</title>
<style>
.alert{padding:15px;margin:15px;border-radius:7px;font-family:Arial}
.info{background:#dbeafe;color:#1e40af}
.success{background:#dcfce7;color:#166534}
.warning{background:#fef3c7;color:#92400e}
.error{background:#fee2e2;color:#991b1b}
</style>
</head>
<body>

<div class="alert info">ℹ Information: Your account is active.</div>
<div class="alert success">✓ Success: Changes saved.</div>
<div class="alert warning">⚠ Warning: Storage is almost full.</div>
<div class="alert error">✕ Error: Something went wrong.</div>

</body>
</html>
