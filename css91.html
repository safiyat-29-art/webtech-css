<!DOCTYPE html>
<html>
<head>
    <title>Analytics Dashboard</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f8fafc;
        }

        .container {
            padding: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #ddd;
        }

        .chart {
            height: 250px;
            margin-top: 20px;
            background: linear-gradient(
                to top,
                #dbeafe,
                white
            );
            border-left: 4px solid #2563eb;
            border-bottom: 4px solid #2563eb;
            display: flex;
            align-items: end;
            gap: 20px;
            padding: 20px;
        }

        .bar {
            width: 40px;
            background: #2563eb;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Analytics Dashboard</h1>
    <p>Business performance overview</p>

    <div class="cards">
        <div class="card">
            <h3>Visitors</h3>
            <h2>125K</h2>
        </div>

        <div class="card">
            <h3>Sessions</h3>
            <h2>84K</h2>
        </div>

        <div class="card">
            <h3>Page Views</h3>
            <h2>342K</h2>
        </div>
    </div>

    <div class="card">
        <h2>Traffic Analytics</h2>

        <div class="chart">
            <div class="bar" style="height:40%"></div>
            <div class="bar" style="height:60%"></div>
            <div class="bar" style="height:50%"></div>
            <div class="bar" style="height:80%"></div>
            <div class="bar" style="height:70%"></div>
            <div class="bar" style="height:90%"></div>
        </div>
    </div>

</div>

</body>
</html>
