<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f5f5f5;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 20px;
        }

        .container {
            padding: 25px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ddd;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-top: 25px;
        }

        th, td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #eff6ff;
        }
    </style>
</head>

<body>

<header>
    <h1>Admin Dashboard</h1>
</header>

<div class="container">

    <div class="grid">
        <div class="card">
            <h3>Total Users</h3>
            <h2>12,540</h2>
        </div>

        <div class="card">
            <h3>Orders</h3>
            <h2>3,280</h2>
        </div>

        <div class="card">
            <h3>Products</h3>
            <h2>842</h2>
        </div>

        <div class="card">
            <h3>Tickets</h3>
            <h2>126</h2>
        </div>
    </div>

    <h2>Recent Users</h2>

    <table>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Status</th>
        </tr>

        <tr>
            <td>John</td>
            <td>john@example.com</td>
            <td>Active</td>
        </tr>

        <tr>
            <td>Priya</td>
            <td>priya@example.com</td>
            <td>Active</td>
        </tr>

        <tr>
            <td>Alex</td>
            <td>alex@example.com</td>
            <td>Pending</td>
        </tr>
    </table>

</div>

</body>
</html>
